
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Micro-interactions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Hover Micro-interactions</h1>

    <p>Move your mouse over the cards and buttons.</p>

    <div class="card">
        <h2>Card 1</h2>
        <p>Hover over this card to see the effect.</p>
        <button>Learn More</button>
    </div>

    <div class="card">
        <h2>Card 2</h2>
        <p>This card also has a hover effect.</p>
        <button>Explore</button>
    </div>

    <div class="card">
        <h2>Card 3</h2>
        <p>Move your mouse over this card.</p>
        <button>Discover</button>
    </div>

</body>
</html>
